name: Deploy Flask App

on:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Clean Docker cache       
              run: docker system prune -f

            - name: Deploy with Docker Compose
              run: docker compose down && docker compose up --build --no-cache -d