name: Deploy Flask App

on:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: deploy with docker compose
              run: docker compose -f .github/workflows/docker-compose.yml down && docker compose -f .github/workflows/docker-compose.yml up --build -d